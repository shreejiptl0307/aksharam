<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600">
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="70%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#2A1F1D" />
      <stop offset="100%" stop-color="#151312" />
    </radialGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C5A0"/>
      <stop offset="50%" stop-color="#B79A67"/>
      <stop offset="100%" stop-color="#8F7242"/>
    </linearGradient>
    <pattern id="luxPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 80 40 L 40 80 L 0 40 Z" fill="none" stroke="rgba(183, 154, 103, 0.18)" stroke-width="0.8"/>
      <circle cx="40" cy="40" r="1.5" fill="#B79A67" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#luxPattern)" opacity="0.85" />

  <!-- Outer Editorial Borders -->
  <rect x="40" y="40" width="2320" height="1520" fill="none" stroke="#B79A67" stroke-width="1" opacity="0.35"/>
  <rect x="52" y="52" width="2296" height="1496" fill="none" stroke="#B79A67" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner Ornaments -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>
  <path d="M 2340 32 L 2368 32 L 2368 60" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>
  <path d="M 32 1540 L 32 1568 L 60 1568" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>
  <path d="M 2340 1568 L 2368 1568 L 2368 1540" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>

  <!-- Center Luxury Motif -->
  <g transform="translate(1200, 760)">
    <circle r="70" fill="none" stroke="#B79A67" stroke-width="1" opacity="0.4"/>
    <circle r="50" fill="none" stroke="#B79A67" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.5"/>
    <polygon points="0,-40 38,0 0,40 -38,0" fill="none" stroke="url(#goldShimmer)" stroke-width="1.2" opacity="0.7"/>
    <text y="8" font-family="'Times New Roman', Georgia, serif" font-size="28" fill="url(#goldShimmer)" text-anchor="middle" font-weight="300" letter-spacing="4">A</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(1200, 850)">
    <rect x="-130" y="-16" width="260" height="32" rx="0" fill="rgba(0,0,0,0.4)" stroke="#B79A67" stroke-width="0.75" opacity="0.8"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B79A67" text-anchor="middle" font-weight="600" letter-spacing="3.5">HERO CAMPAIGN</text>
  </g>

  <!-- Main Title -->
  <text x="1200" y="915" font-family="'Times New Roman', Georgia, serif" font-size="44" fill="#F7F3EC" text-anchor="middle" font-weight="400" letter-spacing="2">
    AKSHARAM CAMPAIGN 2025/26
  </text>

  <!-- Subtitle -->
  <text x="1200" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#D6CCC2" text-anchor="middle" font-weight="300" letter-spacing="1.5">
    Crafted in India • Designed to be Remembered
  </text>

  <!-- Footer Specs & Brand watermark -->
  <text x="70" y="1535" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D6CCC2" opacity="0.8" letter-spacing="2">
    AKSHARAM ETHNIC LLP
  </text>
  <text x="2330" y="1535" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#B79A67" text-anchor="end" opacity="0.8" letter-spacing="1.5">
    2400 × 1600px [REPLACE WITH PHOTOGRAPHY]
  </text>
</svg>