  </text>
  <text x="1556" y="1060" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#73706B" text-anchor="end" font-weight="400" letter-spacing="1">
    1600 × 1100px [PHOTOGRAPHY PLACEHOLDER]
