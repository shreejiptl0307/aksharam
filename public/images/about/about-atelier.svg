<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="70%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#1F1E1B" />
      <stop offset="100%" stop-color="#11100E" />
    </radialGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C5A0"/>
      <stop offset="50%" stop-color="#B79A67"/>
      <stop offset="100%" stop-color="#8F7242"/>
    </linearGradient>
    <pattern id="luxPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 80 40 L 40 80 L 0 40 Z" fill="none" stroke="rgba(247, 243, 236, 0.08)" stroke-width="0.8"/>
      <circle cx="40" cy="40" r="1.5" fill="#B79A67" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#luxPattern)" opacity="0.85" />

  <!-- Outer Editorial Borders -->
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#B79A67" stroke-width="1" opacity="0.35"/>
  <rect x="52" y="52" width="1496" height="896" fill="none" stroke="#B79A67" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner Ornaments -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>
  <path d="M 1540 32 L 1568 32 L 1568 60" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>
  <path d="M 32 940 L 32 968 L 60 968" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>
  <path d="M 1540 968 L 1568 968 L 1568 940" fill="none" stroke="url(#goldShimmer)" stroke-width="2"/>

  <!-- Center Luxury Motif -->
  <g transform="translate(800, 460)">
    <circle r="70" fill="none" stroke="#B79A67" stroke-width="1" opacity="0.4"/>
    <circle r="50" fill="none" stroke="#B79A67" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.5"/>
    <polygon points="0,-40 38,0 0,40 -38,0" fill="none" stroke="url(#goldShimmer)" stroke-width="1.2" opacity="0.7"/>
    <text y="8" font-family="'Times New Roman', Georgia, serif" font-size="28" fill="url(#goldShimmer)" text-anchor="middle" font-weight="300" letter-spacing="4">A</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(800, 550)">
    <rect x="-130" y="-16" width="260" height="32" rx="0" fill="rgba(0,0,0,0.4)" stroke="#B79A67" stroke-width="0.75" opacity="0.8"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B79A67" text-anchor="middle" font-weight="600" letter-spacing="3.5">ATELIER & PRODUCTION</text>
  </g>

  <!-- Main Title -->
  <text x="800" y="615" font-family="'Times New Roman', Georgia, serif" font-size="44" fill="#F7F3EC" text-anchor="middle" font-weight="400" letter-spacing="2">
    SURAT ATELIER
  </text>

  <!-- Subtitle -->
  <text x="800" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#A39C93" text-anchor="middle" font-weight="300" letter-spacing="1.5">
    Laxmi Narayan Industrial Park Manufacturing Hub
  </text>

  <!-- Footer Specs & Brand watermark -->
  <text x="70" y="935" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#A39C93" opacity="0.8" letter-spacing="2">
    AKSHARAM ETHNIC LLP
  </text>
  <text x="1530" y="935" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#B79A67" text-anchor="end" opacity="0.8" letter-spacing="1.5">
    1600 × 1000px [REPLACE WITH PHOTOGRAPHY]
  </text>
</svg>